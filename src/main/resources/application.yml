spring:
  application:
    name: medpret-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/medpret
    username: medpret
    password: medpret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8080