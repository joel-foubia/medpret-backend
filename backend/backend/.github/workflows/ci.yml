name: CI — Tests & Build

on:
  push:
    branches: [ develop, feature/**, fix/** ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: medpret_test
          POSTGRES_USER: medpret
          POSTGRES_PASSWORD: medpret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn clean test
        env:
          DB_HOST: localhost
          DB_NAME: medpret_test
          DB_USER: medpret
          DB_PASSWORD: medpret

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t medpret-backend:${{ github.sha }} .
