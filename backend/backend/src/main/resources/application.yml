spring:
  application:
    name: medpret-backend

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medpret}
    username: ${DB_USER:medpret}
    password: ${DB_PASSWORD:medpret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    jwt:
      secret: ${JWT_SECRET:medpret-secret-key-change-in-production}
      expiration: 86400000

server:
  port: ${PORT:8080}

logging:
  level:
    com.medpret: INFO
    org.hibernate.SQL: WARN
