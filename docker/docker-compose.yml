version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medpret-db
    environment:
      POSTGRES_DB: medpret
      POSTGRES_USER: medpret
      POSTGRES_PASSWORD: medpret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medpret"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: medpret-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: medpret
      DB_USER: medpret
      DB_PASSWORD: medpret
      JWT_SECRET: change-this-in-production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
